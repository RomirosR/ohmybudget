# /etc/nginx/sites-available/ohmybudget.conf
# После DNS: sudo ln -sf /etc/nginx/sites-available/ohmybudget.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# TLS: sudo certbot --nginx -d ohmybudget.by -d www.ohmybudget.by

server {
    listen 80;
    server_name ohmybudget.by www.ohmybudget.by;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
