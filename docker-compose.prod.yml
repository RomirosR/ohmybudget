# Production override: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Секреты — в .env.prod (см. .env.prod.example). Nginx + TLS — на хосте (deploy/nginx/).

services:
  postgres:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped

  backend:
    ports: []
    environment:
      DATABASE_URL: postgresql+psycopg://ohmybudget:${POSTGRES_PASSWORD}@postgres:5432/ohmybudget
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: '["https://ohmybudget.by","https://www.ohmybudget.by"]'
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://ohmybudget.by}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@ohmybudget.by}
      SMTP_HOST: ${SMTP_HOST:-postbox.cloud.yandex.net}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    restart: unless-stopped

  frontend:
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
